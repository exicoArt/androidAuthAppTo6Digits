<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{{ site.description }}">
<style>
  :root {
    --bg: #fbf8f1; --panel: #f1ebdc; --text: #1d1f22; --muted: #5c574c;
    --accent: #9a5b00; --border: #d9d1bd; --code-bg: #ece5d3;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1d1f22; --panel: #2a2d31; --text: #efe9dc; --muted: #b9b3a6;
      --accent: #ffb000; --border: #3a3e44; --code-bg: #2f3338;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { background: var(--panel); border-bottom: 1px solid var(--border); }
  .bar { max-width: 860px; margin: 0 auto; padding: 12px 16px; display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: baseline; }
  .brand { font-weight: 700; color: var(--text); text-decoration: none; }
  nav { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: .95rem; }
  nav a { color: var(--accent); text-decoration: none; }
  nav a:hover, nav a:focus-visible { text-decoration: underline; }
  main { max-width: 860px; margin: 0 auto; padding: 24px 16px 56px; overflow-wrap: anywhere; }
  h1, h2, h3 { line-height: 1.25; }
  h2 { margin-top: 2rem; }
  a { color: var(--accent); }
  table { border-collapse: collapse; width: 100%; display: block; overflow-x: auto; }
  th, td { border: 1px solid var(--border); padding: 8px 10px; text-align: left; vertical-align: top; }
  th { background: var(--panel); }
  code { background: var(--code-bg); padding: 1px 5px; border-radius: 4px; font-size: .92em; }
  pre { background: var(--code-bg); padding: 12px; border-radius: 8px; overflow-x: auto; }
  pre code { background: none; padding: 0; }
  blockquote { margin: 1rem 0; padding: .5rem 1rem; border-left: 4px solid var(--accent); background: var(--panel); }
  footer { max-width: 860px; margin: 0 auto; padding: 0 16px 32px; color: var(--muted); font-size: .85rem; }
</style>
</head>
<body>
<header>
  <div class="bar">
    <a class="brand" href="{{ '/' | relative_url }}">{{ site.title }}</a>
    <nav aria-label="Guide pages">
      <a href="{{ '/docs/setup-authenticator.html' | relative_url }}">Setup</a>
      <a href="{{ '/docs/threat-model.html' | relative_url }}">Threat model</a>
      <a href="{{ '/docs/safe-money-checklist.html' | relative_url }}">Safe money</a>
      <a href="{{ '/docs/dns-mismatch-trap.html' | relative_url }}">DNS warning</a>
      <a href="{{ '/docs/architecture.html' | relative_url }}">Architecture</a>
    </nav>
  </div>
</header>
<main>
{{ content }}
</main>
<footer>Educational guidance only, not a security audit or financial advice.</footer>
</body>
</html>
